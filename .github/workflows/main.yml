name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker)
        # This uses a pre-built container with all Android tools (AIDL, NDK, SDK) ready
        uses: its-pointless/buildozer-action@v1.2
        with:
          command: buildozer android debug --yes
          buildozer_version: master

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaisalBird-Game-APK
          path: bin/*.apk
