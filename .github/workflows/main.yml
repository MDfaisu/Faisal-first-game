name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          python3-pip build-essential libltdl-dev libgmp-dev libmpc-dev libmpfr-dev \
          openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Fix AIDL Path
        run: |
          # Manually install build-tools and link aidl if missing
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.0"
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0

      - name: Build APK with Buildozer
        run: |
          # --yes accepts all Android SDK licenses
          buildozer android debug --yes
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          # Helping Buildozer find the Android SDK
          ANDROID_SDK_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaisalBird-Game-APK
          path: bin/*.apk
